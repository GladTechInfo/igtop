[package]
name = "igtop"
version = "0.2.0"
edition = "2021"
description = "Terminal monitor for Intel (i915) and AMD (amdgpu) GPUs"
license = "GPL-3.0-or-later"
repository = "https://github.com/lukazibi83/igtop"
readme = "README.md"
keywords = ["gpu", "intel", "amd", "monitor", "tui"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
ratatui = "=0.29.0"
crossterm = "=0.28.1"
libc = "0.2"

# Debian and Ubuntu package (`cargo deb`). Release builds package the static
# musl binary, so the package has no library dependencies.
[package.metadata.deb]
maintainer = "lukazibi83 <205174930+lukazibi83@users.noreply.github.com>"
copyright = "lukazibi83"
section = "utils"
priority = "optional"
extended-description = """\
Terminal monitor for Intel GPUs on the i915 driver (Arc Alchemist and integrated \
graphics) and AMD GPUs on amdgpu, side by side in one instance: per-engine \
utilisation, achieved clock, temperature, power, VRAM and throttle reasons, and \
per-process attribution labelled with the container or VM each process runs in. \
Needs root for Intel cards, and to see every process on AMD ones."""
recommends = "hwdata | pci.ids"
assets = [
    ["target/release/igtop", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/igtop/README.md", "644"],
]

# Fedora, RHEL and openSUSE package (`cargo generate-rpm`).
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/igtop", dest = "/usr/bin/igtop", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/igtop/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/igtop/LICENSE", mode = "644", doc = true },
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Nothing here unwinds deliberately, and ratatui's panic hook still restores
# the terminal, since the hook runs before the abort.
panic = "abort"
